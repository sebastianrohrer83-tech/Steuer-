<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ordni – Steuerordner für die Familie</title>
  <meta name="description" content="Ordni: der Steuerordner für die Familie. Belege scannen, ordnen und für die Online-Steuererklärung bereithalten.">
  <meta name="theme-color" content="#0f1f3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ordni">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css?v=1.9.0">
  <link rel="stylesheet" href="./ui.css?v=1.9.0">
  <link rel="stylesheet" href="./theme.css?v=2.7.2">
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="iconbtn" aria-label="Zurück">‹</button>
    <h1 id="title">Ordni</h1>
    <div id="headerRight"></div>
  </header>
  <main id="view" aria-live="polite"></main>

  <input type="file" id="camInput" accept="image/*" capture="environment" hidden>
  <input type="file" id="galInput" accept="image/*,application/pdf,.pdf" multiple hidden>
  <input type="file" id="zipInput" multiple hidden>

  <div id="toast" role="status"></div>
  <div id="busy"><div class="spinner"></div><span>Bitte warten …</span></div>
  <dialog id="dlg"></dialog>

  <script type="module" src="./app.js?v=1.16.1"></script>
  <script type="module" src="./install.js?v=1.9.0"></script>
  <script src="./icons.js?v=2.0.0" defer></script>
</body>
</html>
